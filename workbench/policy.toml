"deploy-to-vercel" = { label_zh = "部署到 Vercel", purpose_zh = "创建 Vercel 预览或生产部署并返回链接", category = "release", phases = ["release"] }
"dispatching-parallel-agents" = { label_zh = "并行子任务", purpose_zh = "把互不依赖且不共享写状态的任务并行委派", category = "supervision", phases = ["plan", "execute"] }
