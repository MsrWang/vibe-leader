schema_version = 2
primary_router = "using-superpowers"
explicit_only = ["vibe-project-lead-zh", "agent-skills:using-agent-skills"]

[attention_budget]
process_default = 1
domain_default = 2
hard_cap = false

[categories]
supervision = { label_zh = "主管与流程", order = 10 }
planning = { label_zh = "需求与规划", order = 20 }
exploration = { label_zh = "代码理解与资料", order = 30 }
development = { label_zh = "开发与测试", order = 40 }
review = { label_zh = "审查与安全", order = 50 }
frontend = { label_zh = "网页与界面", order = 60 }
release = { label_zh = "部署与运维", order = 70 }
browser = { label_zh = "浏览器与网页自动化", order = 80 }
artifacts = { label_zh = "文档与内容工具", order = 90 }
system = { label_zh = "Codex 系统工具", order = 100 }
unmapped = { label_zh = "未映射", order = 999 }

[phases]
intake = { label_zh = "需求澄清", order = 10 }
bind = { label_zh = "项目绑定", order = 20 }
discover = { label_zh = "代码探索", order = 30 }
spec = { label_zh = "规格设计", order = 40 }
plan = { label_zh = "任务规划", order = 50 }
execute = { label_zh = "实现", order = 60 }
verify = { label_zh = "验证", order = 70 }
review = { label_zh = "审查", order = 80 }
release = { label_zh = "部署上线", order = 90 }
checkpoint = { label_zh = "进度检查点", order = 100 }

[phase_priorities]
intake = ["brainstorming", "agent-skills:interview-me", "agent-skills:idea-refine"]
bind = ["agent-skills:context-engineering"]
discover = ["agent-skills:context-engineering", "agent-skills:source-driven-development"]
spec = ["agent-skills:spec-driven-development", "brainstorming", "agent-skills:api-and-interface-design"]
plan = ["writing-plans", "agent-skills:planning-and-task-breakdown"]
execute = ["test-driven-development", "agent-skills:incremental-implementation", "using-git-worktrees"]
verify = ["verification-before-completion", "agent-skills:test-driven-development"]
review = ["requesting-code-review", "agent-skills:code-review-and-quality", "agent-skills:security-and-hardening"]
release = ["agent-skills:shipping-and-launch", "agent-skills:ci-cd-and-automation", "deploy-to-vercel"]
checkpoint = ["agent-skills:documentation-and-adrs"]

[mandatory.before_any_action]
ids = ["using-superpowers"]

[mandatory.before_project_write]
ids = ["test-driven-development", "agent-skills:git-workflow-and-versioning"]

[mandatory.before_completion]
ids = ["verification-before-completion"]

[mandatory.before_third_party_install]
ids = ["skillspector-security-gate"]

[mandatory.before_release]
ids = ["agent-skills:shipping-and-launch"]

[skills]
"agent-skills:api-and-interface-design" = { label_zh = "API 与接口设计", purpose_zh = "设计稳定的 API、模块边界和公共契约", category = "development", phases = ["spec", "execute"] }
"agent-skills:browser-testing-with-devtools" = { label_zh = "浏览器 DevTools 测试", purpose_zh = "用真实浏览器检查 DOM、控制台、网络和性能", category = "browser", phases = ["verify", "review"] }
"agent-skills:ci-cd-and-automation" = { label_zh = "CI/CD 与自动化", purpose_zh = "建立持续集成、质量门禁和部署流水线", category = "release", phases = ["plan", "release"] }
"agent-skills:code-review-and-quality" = { label_zh = "代码质量审查", purpose_zh = "从多个维度审查合并前的代码质量", category = "review", phases = ["review"] }
"agent-skills:code-simplification" = { label_zh = "代码简化", purpose_zh = "在不改变行为的前提下减少复杂度", category = "development", phases = ["execute", "review"] }
"agent-skills:context-engineering" = { label_zh = "上下文工程", purpose_zh = "整理项目上下文并减少任务切换造成的信息噪声", category = "supervision", phases = ["bind", "discover"] }
"agent-skills:debugging-and-error-recovery" = { label_zh = "调试与错误恢复", purpose_zh = "系统定位测试、构建和运行异常的根因", category = "development", phases = ["execute", "verify"] }
"agent-skills:deprecation-and-migration" = { label_zh = "弃用与迁移", purpose_zh = "规划旧接口、旧系统和数据迁移", category = "release", phases = ["spec", "release"] }
"agent-skills:documentation-and-adrs" = { label_zh = "文档与 ADR", purpose_zh = "记录架构决策和未来维护所需上下文", category = "supervision", phases = ["spec", "checkpoint"] }
"agent-skills:doubt-driven-development" = { label_zh = "质疑驱动开发", purpose_zh = "对高风险非平凡决策做新鲜上下文对抗审查", category = "review", phases = ["spec", "review"] }
"agent-skills:frontend-ui-engineering" = { label_zh = "前端 UI 工程", purpose_zh = "构建可访问、响应式且达到生产质量的界面", category = "frontend", phases = ["execute", "verify"] }
"agent-skills:git-workflow-and-versioning" = { label_zh = "Git 工作流与版本", purpose_zh = "用分支、原子提交和版本管理控制变更", category = "development", phases = ["plan", "execute", "release"] }
"agent-skills:idea-refine" = { label_zh = "想法提炼", purpose_zh = "发散、质疑并收敛尚未成形的想法", category = "planning", phases = ["intake"] }
"agent-skills:incremental-implementation" = { label_zh = "增量实现", purpose_zh = "把多文件改动拆成可测试、可回滚的小步", category = "development", phases = ["execute"] }
"agent-skills:interview-me" = { label_zh = "需求访谈", purpose_zh = "通过逐问澄清真实目标、用户和成功标准", category = "planning", phases = ["intake"] }
"agent-skills:observability-and-instrumentation" = { label_zh = "可观测性", purpose_zh = "增加日志、指标、追踪和告警证据", category = "release", phases = ["execute", "release"] }
"agent-skills:performance-optimization" = { label_zh = "性能优化", purpose_zh = "依据测量定位并修复前后端性能瓶颈", category = "development", phases = ["verify", "review"] }
"agent-skills:planning-and-task-breakdown" = { label_zh = "计划与任务拆解", purpose_zh = "把清晰规格拆成有依赖顺序的可执行任务", category = "planning", phases = ["plan"] }
"agent-skills:security-and-hardening" = { label_zh = "安全加固", purpose_zh = "检查输入、认证、存储和外部集成的安全风险", category = "review", phases = ["execute", "review", "release"] }
"agent-skills:shipping-and-launch" = { label_zh = "发布与上线", purpose_zh = "准备上线检查、分阶段发布、监控和回滚", category = "release", phases = ["release"] }
"agent-skills:source-driven-development" = { label_zh = "资料驱动开发", purpose_zh = "用官方资料和当前源码约束技术实现", category = "exploration", phases = ["discover", "spec", "execute"] }
"agent-skills:spec-driven-development" = { label_zh = "规格驱动开发", purpose_zh = "在重大功能和项目开始前形成明确规格", category = "planning", phases = ["spec"] }
"agent-skills:test-driven-development" = { label_zh = "工程 TDD", purpose_zh = "以失败测试驱动逻辑实现和行为变更", category = "development", phases = ["execute", "verify"] }
"agent-skills:using-agent-skills" = { label_zh = "Addy Skill 路由", purpose_zh = "显式浏览 Addy 工程 Skill；不作为默认元路由", category = "supervision", phases = ["discover"] }
"brainstorming" = { label_zh = "方案构思", purpose_zh = "在创作或实现前澄清意图、方案和设计", category = "planning", phases = ["intake", "spec"] }
"browser:control-in-app-browser" = { label_zh = "应用内浏览器控制", purpose_zh = "打开、检查和操作 Codex 应用内浏览器", category = "browser", phases = ["execute", "verify"] }
