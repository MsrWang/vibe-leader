"smart-search" = { label_zh = "OpenCLI 智能搜索", purpose_zh = "为站点、社交媒体和资料查询选择搜索路径", category = "exploration", phases = ["discover"] }
"spreadsheets:Spreadsheets" = { label_zh = "电子表格", purpose_zh = "创建、分析并验证独立表格文件", category = "artifacts", phases = ["execute", "verify"] }
"spreadsheets:excel-live-control" = { label_zh = "Excel 实时控制", purpose_zh = "操作用户当前打开的 Microsoft Excel 工作簿", category = "artifacts", phases = ["execute", "verify"] }
