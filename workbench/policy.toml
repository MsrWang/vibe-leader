# Routing is separate from the legacy complete-inventory audit above.
# Host/user/loaded-Skill requirements arrive explicitly for each current action.
[routing]
core_ids = ["vibe-project-lead-zh"]

[[routing.capabilities]]
label_zh = "项目主管"
purpose_zh = "绑定项目、澄清目标、规划执行、核验交付；主管自身必需"
example_ids = ["vibe-project-lead-zh"]

[[routing.capabilities]]
label_zh = "需求与计划"
purpose_zh = "需要时澄清方案、拆解任务；扩展示例"
example_ids = ["brainstorming", "writing-plans"]

[[routing.capabilities]]
label_zh = "代码实现与调试"
purpose_zh = "实现、测试、复现并定位问题；扩展示例"
example_ids = ["test-driven-development", "systematic-debugging"]

[[routing.capabilities]]
label_zh = "验证与审查"
purpose_zh = "核对完成证据、审查变更；扩展示例"
example_ids = ["verification-before-completion", "requesting-code-review"]

[[routing.capabilities]]
label_zh = "网页与界面"
purpose_zh = "实现界面并检查可访问性、响应式与交互；扩展示例"
example_ids = ["web-design-guidelines"]

[[routing.capabilities]]
label_zh = "文件与视觉产物"
purpose_zh = "按当前发现选择文档、表格、演示或图像工具；扩展示例"
example_ids = ["imagegen", "visualize:visualize"]

[[routing.capabilities]]
label_zh = "安装与外部工具"
purpose_zh = "当前要求触发时执行第三方安全审查；扩展示例，不代表安装批准"
example_ids = ["skillspector-security-gate"]

[[routing.capabilities]]
label_zh = "发布与回退"
purpose_zh = "按目标环境选择发布工具并保留验证、审批及回退；扩展示例"
example_ids = ["finishing-a-development-branch"]
